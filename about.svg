<svg xmlns="http://www.w3.org/2000/svg" width="900" height="244" viewBox="0 0 900 244" role="img" aria-label="Tentang saya: Rizka Farida, Full Stack Developer dan mahasiswa">
<title>Tentang saya: Rizka Farida, Full Stack Developer dan mahasiswa</title>
<defs></defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1s ease-out both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="899" height="243" rx="14" fill="#161B22" stroke="#30363D"/>
<rect x="524" y="36" width="1" height="172" fill="#30363D"/>
<text class="fade" x="48" y="82" font-size="22" font-weight="700" fill="#E6EDF3">Halo, saya Rizka Farida.</text>
<text class="fade" style="animation-delay:0.15s" x="48" y="120" font-size="15.5" fill="#C9D1D9">Mahasiswa dan Full Stack Developer yang</text>
<text class="fade" style="animation-delay:0.27s" x="48" y="146" font-size="15.5" fill="#C9D1D9">membangun aplikasi web dengan Vue dan Laravel.</text>
<text class="fade" style="animation-delay:0.39s" x="48" y="172" font-size="15.5" fill="#C9D1D9">Fokus saya pada antarmuka yang bersih, kode</text>
<text class="fade" style="animation-delay:0.51s" x="48" y="198" font-size="15.5" fill="#C9D1D9">yang rapi, dan proyek yang benar-benar dipakai.</text>
<text class="m" x="556" y="62" font-size="11" fill="#8B949E" letter-spacing="2">SEKILAS</text>
<g class="fade" style="animation-delay:0.2s"><text x="556" y="98" font-size="12.5" fill="#8B949E">Peran</text><text x="652" y="98" font-size="14" fill="#E6EDF3">Full Stack Developer</text></g>
<g class="fade" style="animation-delay:0.3s"><text x="556" y="128" font-size="12.5" fill="#8B949E">Status</text><text x="652" y="128" font-size="14" fill="#E6EDF3">Mahasiswa</text></g>
<g class="fade" style="animation-delay:0.4s"><text x="556" y="158" font-size="12.5" fill="#8B949E">Stack utama</text><text x="652" y="158" font-size="14" fill="#E6EDF3">Vue.js · Laravel</text></g>
<g class="fade" style="animation-delay:0.5s"><text x="556" y="188" font-size="12.5" fill="#8B949E">Desain</text><text x="652" y="188" font-size="14" fill="#E6EDF3">Figma · Google AI Studio</text></g>
<g class="fade" style="animation-delay:0.6s"><text x="556" y="218" font-size="12.5" fill="#8B949E">Kolaborasi</text><text x="652" y="218" font-size="14" fill="#E6EDF3">Terbuka</text></g>
