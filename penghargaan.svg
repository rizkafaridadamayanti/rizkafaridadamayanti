<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="164" viewBox="0 0 900 164" role="img" aria-label="Penghargaan: Pull Shark terbuka">
<title>Penghargaan: Pull Shark terbuka</title>
<defs>
<radialGradient id="gB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#58A6FF" stop-opacity=".2"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E3B341" stop-opacity=".1"/><stop offset="1" stop-color="#E3B341" stop-opacity="0"/></radialGradient>

</defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.up{animation:up .8s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide{animation:slide .6s ease-out both}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.flt{animation:flt 6s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 9s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:.85;transform:scale(1)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
.growy{transform-box:fill-box;transform-origin:center top;animation:growy 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
.arc{animation:arc 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes arc{from{stroke-dasharray:0 440}}
.spin{animation:spin 40s linear infinite}
.spin2{animation:spin 26s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.trav{animation:trav 8s ease-in-out infinite alternate}
@keyframes trav{from{transform:translateX(0)}to{transform:translateX(640px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(0,14)"><g class="up" style="animation-delay:0s"><g class="up"><rect x=".5" y=".5" width="899" height="135" rx="20" fill="#161B22" stroke="#30363D"/><g class="spin" style="transform-origin:90px 68px"><circle cx="90" cy="68" r="46" fill="none" stroke="#E3B341" stroke-opacity=".45" stroke-dasharray="3 8" stroke-linecap="round"/></g>
<circle cx="90" cy="68" r="36" fill="#0D1117" stroke="#E3B341" stroke-opacity=".8" stroke-width="1.5"/>
<path d="M90,43 L96,57.5 111.5,59 99.8,69.2 103.4,84.5 90,76.4 76.6,84.5 80.2,69.2 68.5,59 84,57.5 Z" fill="#E3B341"/>
<text x="162" y="58" font-size="25" font-weight="700" fill="#E6EDF3">Pull Shark</text>
<rect x="162" y="70" width="82" height="22" rx="11" fill="#3FB950" fill-opacity=".14" stroke="#3FB950" stroke-opacity=".7"/><text class="m" x="203" y="85" font-size="11" fill="#3FB950" text-anchor="middle">TERBUKA</text>
<text x="162" y="116" font-size="14" fill="#8B949E">Membuka pull request yang berhasil di-merge.</text><g class="flt" style="animation-delay:0.0s"><circle cx="700" cy="64" r="28" fill="none" stroke="#8B949E" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="700" y="73" font-size="24" font-weight="700" fill="#8B949E" fill-opacity=".7" text-anchor="middle">?</text></g><text class="m" x="700" y="116" font-size="10" fill="#8B949E" letter-spacing="2" text-anchor="middle">TERKUNCI</text><g class="flt" style="animation-delay:0.9s"><circle cx="790" cy="64" r="28" fill="none" stroke="#8B949E" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="790" y="73" font-size="24" font-weight="700" fill="#8B949E" fill-opacity=".7" text-anchor="middle">?</text></g><text class="m" x="790" y="116" font-size="10" fill="#8B949E" letter-spacing="2" text-anchor="middle">TERKUNCI</text><g><rect x="24" y="-12" width="130" height="24" rx="12" fill="#0D1117" stroke="#E3B341" stroke-opacity=".8"/><circle cx="38" cy="0" r="3" fill="#E3B341"/><text class="m" x="48" y="4" font-size="11.5" fill="#E3B341">// penghargaan</text></g></g></g></g>
</svg>
