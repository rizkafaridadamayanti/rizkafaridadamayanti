<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Mari berkolaborasi: terbuka untuk kolaborasi">
<title>Mari berkolaborasi: terbuka untuk kolaborasi</title>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#2E2621"/></pattern>
<linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="mR" maskUnits="userSpaceOnUse" x="450" y="0" width="450" height="400"><rect x="450" y="0" width="450" height="400" fill="url(#fadeR)"/></mask>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E2737B" stop-opacity=".13"/><stop offset="1" stop-color="#E2737B" stop-opacity="0"/></radialGradient><clipPath id="face"><circle cx="772" cy="95" r="50"/></clipPath></defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1s ease-out both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="899" height="189" rx="14" fill="#1F1A17" stroke="#3A302A"/>
<rect x="450" y="1" width="449" height="188" fill="url(#dots)" mask="url(#mR)"/>
<circle cx="772" cy="95" r="62" fill="none" stroke="#3A302A"/>
<circle cx="772" cy="95" r="90" fill="none" stroke="#3A302A"/>
<image xlink:href="data:image/jpeg;base64," x="722" y="45" width="100" height="100" clip-path="url(#face)"/>
<circle cx="772" cy="95" r="54" fill="none" stroke="#E2737B" stroke-opacity=".75" stroke-width="1.5"/>
<circle class="pulse" cx="810" cy="133" r="9" fill="#9DB17C" fill-opacity=".3"/>
<circle cx="810" cy="133" r="4.5" fill="#9DB17C" stroke="#1F1A17" stroke-width="2"/>
<g class="fade" style="animation-delay:.1s">
<rect x="48" y="34" width="206" height="28" rx="14" fill="none" stroke="#3A302A"/>
<circle class="pulse" cx="64" cy="48" r="7" fill="#9DB17C" fill-opacity=".3"/>
<circle cx="64" cy="48" r="3.5" fill="#9DB17C"/>
<text x="80" y="53" font-size="12.5" fill="#A39482">Terbuka untuk kolaborasi</text></g>
<text class="fade" style="animation-delay:.2s" x="48" y="106" font-size="36" font-weight="700" fill="#F4EBDD" letter-spacing="-0.5">Mari berkolaborasi</text>
<text class="fade" style="animation-delay:.3s" x="48" y="142" font-size="16" fill="#A39482">Punya ide atau proyek? Ayo bangun bersama.</text>
</svg>
