<svg xmlns="http://www.w3.org/2000/svg" width="290" height="240" viewBox="0 0 290 240" role="img" aria-label="Proyek NusaStay">
<defs>
<linearGradient id="a" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#6C63FF"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="288" height="238" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bob{animation:bob 3.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.arrow{animation:arr 1.4s ease-in-out infinite}
@keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
</style>
<rect x="1" y="1" width="288" height="238" rx="18" fill="#fff" stroke="#0891B2" stroke-opacity=".3" stroke-width="1.5"/>
<g clip-path="url(#c)">
<rect x="1" y="1" width="288" height="6" fill="url(#a)"/>
<rect y="1" width="70" height="6" fill="#fff" opacity=".6"><animate attributeName="x" values="-70;290" dur="2.8s" repeatCount="indefinite"/></rect>
</g>
<g class="bob"><rect x="22" y="26" width="46" height="46" rx="13" fill="#0891B2" fill-opacity=".12"/>
<text x="45" y="58" text-anchor="middle" font-size="22">&#127976;</text></g>
<text x="82" y="46" font-size="19" font-weight="800" fill="#1E1B4B">NusaStay</text>
<text x="82" y="66" font-size="12" font-weight="600" fill="#0891B2">Platform Pemesanan Penginapan</text>
<text x="22" y="106" font-size="13" fill="#475569">Antarmuka frontend untuk platform</text><text x="22" y="126" font-size="13" fill="#475569">pemesanan penginapan, dibangun</text><text x="22" y="146" font-size="13" fill="#475569">dengan Vue dan Vite.</text>
<g class="fade" style="animation-delay:0.30s"><rect x="22" y="170" width="44" height="24" rx="12" fill="#0891B2" fill-opacity=".1"/><text x="44.0" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#0891B2">Vue</text></g><g class="fade" style="animation-delay:0.42s"><rect x="74" y="170" width="51" height="24" rx="12" fill="#0891B2" fill-opacity=".1"/><text x="99.5" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#0891B2">Vite</text></g>
<line x1="22" y1="208" x2="268" y2="208" stroke="#EEF0FA"/>
<text x="22" y="228" font-size="13" font-weight="700" fill="#0891B2">Lihat repository</text>
<text class="arrow" x="142" y="228" font-size="14" font-weight="700" fill="#0891B2">&#8594;</text>
</svg>