<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Distrik 05 - Statistik"><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131C42"/><stop offset="1" stop-color="#0B1020"/></linearGradient><radialGradient id="rg"><stop offset="0" stop-color="#4C74C9" stop-opacity=".30"/><stop offset="1" stop-color="#4C74C9" stop-opacity="0"/></radialGradient><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></linearGradient></defs><style>
