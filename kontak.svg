<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="244" viewBox="0 0 900 244" role="img" aria-label="Mari berkolaborasi: terbuka untuk kolaborasi">
<title>Mari berkolaborasi: terbuka untuk kolaborasi</title>
<defs>
<radialGradient id="gB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#58A6FF" stop-opacity=".2"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E3B341" stop-opacity=".1"/><stop offset="1" stop-color="#E3B341" stop-opacity="0"/></radialGradient>
<clipPath id="face"><circle cx="772" cy="116" r="54"/></clipPath><clipPath id="ct"><rect width="900" height="216" rx="20"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.up{animation:up .8s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide{animation:slide .6s ease-out both}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.flt{animation:flt 6s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sway{animation:sway 9s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:.85;transform:scale(1)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
.growy{transform-box:fill-box;transform-origin:center top;animation:growy 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
.arc{animation:arc 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes arc{from{stroke-dasharray:0 440}}
.spin{animation:spin 40s linear infinite}
.spin2{animation:spin 26s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.trav{animation:trav 8s ease-in-out infinite alternate}
@keyframes trav{from{transform:translateX(0)}to{transform:translateX(640px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(0,14)"><g class="up" style="animation-delay:0s"><g class="up"><rect x=".5" y=".5" width="899" height="215" rx="20" fill="#161B22" stroke="#30363D"/><g clip-path="url(#ct)"><circle cx="772" cy="108" r="250" fill="url(#gB)"/></g>
<g transform="translate(470,40) scale(1)"><path class="tw" style="animation-delay:0.2s" d="M0,-6 L1.6,-1.6 6,0 1.6,1.6 0,6 -1.6,1.6 -6,0 -1.6,-1.6Z" fill="#E3B341"/></g><g transform="translate(520,176) scale(0.8)"><path class="tw" style="animation-delay:1.5s" d="M0,-6 L1.6,-1.6 6,0 1.6,1.6 0,6 -1.6,1.6 -6,0 -1.6,-1.6Z" fill="#E6EDF3"/></g>
<g class="slide"><circle class="pulse" cx="62" cy="62" r="7" fill="#3FB950" fill-opacity=".3"/><circle cx="62" cy="62" r="3.5" fill="#3FB950"/><text class="m" x="78" y="66.5" font-size="12.5" fill="#8B949E" letter-spacing=".5">terbuka untuk kolaborasi</text></g>
<text class="up" style="animation-delay:.2s" x="56" y="122" font-size="40" font-weight="700" fill="#E6EDF3" letter-spacing="-.5">Mari berkolaborasi</text>
<text class="up" style="animation-delay:.3s" x="56" y="160" font-size="16" fill="#C9D1D9">Punya ide atau proyek? Ayo bangun bersama.</text>
<circle cx="772" cy="108" r="92" fill="none" stroke="#30363D"/>
<g class="spin2" style="transform-origin:772px 108px"><circle cx="864" cy="108" r="5" fill="#E3B341"/><circle cx="772" cy="16" r="3.5" fill="#58A6FF"/></g>
<g class="spin" style="transform-origin:772px 108px"><circle cx="772" cy="108" r="72" fill="none" stroke="#58A6FF" stroke-opacity=".4" stroke-dasharray="3 9" stroke-linecap="round"/></g>
<g class="flt" style="animation-duration:7s"><image xlink:href="data:image/jpeg;base64," x="718" y="62" width="108" height="108" clip-path="url(#face)" transform="translate(0,-8)"/>
<circle cx="772" cy="108" r="54" fill="none" stroke="#58A6FF" stroke-opacity=".75" stroke-width="1.5"/></g><g><rect x="24" y="-12" width="94" height="24" rx="12" fill="#0D1117" stroke="#3FB950" stroke-opacity=".8"/><circle cx="38" cy="0" r="3" fill="#3FB950"/><text class="m" x="48" y="4" font-size="11.5" fill="#3FB950">// kontak</text></g></g></g></g>
</svg>
