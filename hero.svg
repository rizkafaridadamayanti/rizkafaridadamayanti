<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272" role="img" aria-label="Rizka Farida - Full Stack Developer">
<title>Rizka Farida - Full Stack Developer</title>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#2A313A"/></pattern>
<linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="mR" maskUnits="userSpaceOnUse" x="450" y="0" width="450" height="400"><rect x="450" y="0" width="450" height="400" fill="url(#fadeR)"/></mask>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7D9BD6" stop-opacity=".13"/><stop offset="1" stop-color="#7D9BD6" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1s ease-out both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="899" height="271" rx="14" fill="#161B22" stroke="#30363D"/>
<circle cx="760" cy="90" r="260" fill="url(#glow)"/>
<rect x="450" y="1" width="449" height="270" fill="url(#dots)" mask="url(#mR)"/>
<g class="fade" style="animation-delay:.1s">
<rect x="48" y="36" width="206" height="28" rx="14" fill="none" stroke="#30363D"/>
<circle class="pulse" cx="64" cy="50" r="7" fill="#56A27B" fill-opacity=".3"/>
<circle cx="64" cy="50" r="3.5" fill="#56A27B"/>
<text x="80" y="55" font-size="12.5" fill="#8B949E">Terbuka untuk kolaborasi</text></g>
<text class="fade" style="animation-delay:.2s" x="48" y="130" font-size="54" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Rizka Farida</text>
<text class="fade" style="animation-delay:.3s" x="48" y="168" font-size="21"><tspan fill="#7D9BD6" font-weight="600">Full Stack Developer</tspan><tspan fill="#8B949E"> · Mahasiswa</tspan></text>
<text class="fade" style="animation-delay:.4s" x="48" y="202" font-size="15.5" fill="#8B949E">Membangun aplikasi web dengan Vue &amp; Laravel.</text>
<text class="m fade" style="animation-delay:.5s" x="48" y="244" font-size="13" fill="#8B949E">rizkafarida.site.je</text>
<rect class="blink" x="201" y="233" width="8" height="15" fill="#7D9BD6"/>
<rect x="566" y="36" width="286" height="200" rx="10" fill="#0D1117" stroke="#30363D"/>
<line x1="566" y1="66" x2="852" y2="66" stroke="#30363D"/>
<circle cx="584" cy="51" r="4.5" fill="#2A313A"/>
<circle cx="600" cy="51" r="4.5" fill="#2A313A"/>
<circle cx="616" cy="51" r="4.5" fill="#2A313A"/>
<text class="m fade" style="animation-delay:0.5s" x="584" y="98" font-size="13"><tspan fill="#A592D6">const</tspan><tspan fill="#C9D1D9"> rizka</tspan><tspan fill="#8B949E"> = {</tspan></text>
<text class="m fade" style="animation-delay:0.7s" x="600" y="120" font-size="13"><tspan fill="#C9D1D9">role:</tspan><tspan fill="#7FB59A"> "Full Stack Developer"</tspan><tspan fill="#8B949E">,</tspan></text>
<text class="m fade" style="animation-delay:0.9s" x="600" y="142" font-size="13"><tspan fill="#C9D1D9">stack:</tspan><tspan fill="#8B949E"> [</tspan><tspan fill="#7FB59A">"Vue"</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#7FB59A">"Laravel"</tspan><tspan fill="#8B949E">],</tspan></text>
<text class="m fade" style="animation-delay:1.1s" x="600" y="164" font-size="13"><tspan fill="#C9D1D9">status:</tspan><tspan fill="#7FB59A"> "Mahasiswa"</tspan><tspan fill="#8B949E">,</tspan></text>
<text class="m fade" style="animation-delay:1.3s" x="600" y="186" font-size="13"><tspan fill="#C9D1D9">openToCollab:</tspan><tspan fill="#A592D6"> true</tspan><tspan fill="#8B949E">,</tspan></text>
<text class="m fade" style="animation-delay:1.5s" x="584" y="208" font-size="13"><tspan fill="#8B949E">};</tspan></text>
</svg>
