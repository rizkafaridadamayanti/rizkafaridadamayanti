<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" role="img" aria-label="Persentase bahasa: Vue 39,6%, JavaScript 22,4%, TypeScript 16,1%, Blade 16,0%, CSS 5,8%">
<title>Persentase bahasa: Vue 39,6%, JavaScript 22,4%, TypeScript 16,1%, Blade 16,0%, CSS 5,8%</title>
<defs><clipPath id="round"><rect x="48" y="70" width="804" height="14" rx="7"/></clipPath><clipPath id="reveal"><rect x="48" y="60" width="0" height="34"><animate attributeName="width" from="0" to="804" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/></rect></clipPath></defs>
<style>
