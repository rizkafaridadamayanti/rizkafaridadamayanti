name: Latest Blog Posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest articles into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Ganti dengan RSS feed blog kamu (dev.to, Medium, Hashnode, blog pribadi, dll.)
          feed_list: "https://dev.to/feed/USERNAME"
          max_post_count: 5
          template: "- [$title]($url) — $date"
          date_format: "d mmm yyyy"
