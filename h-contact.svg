<svg xmlns="http://www.w3.org/2000/svg" width="900" height="52" viewBox="0 0 900 52" role="img" aria-label="Kontak">
<title>Kontak</title>
<defs></defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1s ease-out both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text class="m" x="4" y="28" font-size="13" fill="#7D9BD6" letter-spacing="1.5">07</text>
<text x="38" y="29" font-size="20" font-weight="650" fill="#E6EDF3">Kontak</text>
<rect x="0" y="43" width="900" height="1" fill="#30363D"/>
<rect class="draw" x="0" y="42" width="56" height="2.5" rx="1.25" fill="#7D9BD6"/>
</svg>
