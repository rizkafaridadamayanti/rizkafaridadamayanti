<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Rizka Farida Damayanti - Frontend Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F5FF"/><stop offset="1" stop-color="#E8F5FF"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6C63FF" flood-opacity="0.18"/></filter>
<clipPath id="clip"><rect width="900" height="300" rx="24"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.b1{animation:b1 9s ease-in-out infinite}
.b2{animation:b2 11s ease-in-out infinite}
.b3{animation:b1 13s ease-in-out infinite reverse}
@keyframes b1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,25px)}}
@keyframes b2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,30px)}}
.role{opacity:0;animation:role 12s ease-in-out infinite}
.r2{animation-delay:4s}.r3{animation-delay:8s}
@keyframes role{0%{opacity:0;transform:translateY(14px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-14px)}}
.fade{opacity:0;animation:fade .9s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:rip 2s ease-out infinite}
@keyframes rip{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="300" fill="url(#bg)"/>
<circle class="b1" cx="120" cy="270" r="120" fill="#6C63FF" opacity=".16" filter="url(#blur)"/>
<circle class="b2" cx="780" cy="40" r="130" fill="#00B4D8" opacity=".17" filter="url(#blur)"/>
<circle class="b3" cx="470" cy="300" r="90" fill="#FF9F1C" opacity=".14" filter="url(#blur)"/>
</g>
<rect x="1" y="1" width="898" height="298" rx="24" fill="none" stroke="#E4E0FF" stroke-width="2"/>

<g class="fade" style="animation-delay:.1s">
<rect x="60" y="36" width="206" height="30" rx="15" fill="#fff" stroke="#E4E0FF"/>
<circle cx="80" cy="51" r="4.5" fill="#22C55E"/>
<circle class="ripple" cx="80" cy="51" r="4.5" fill="#22C55E"/>
<text x="95" y="56" font-size="13" font-weight="600" fill="#475569">Terbuka untuk kolaborasi</text>
</g>
<text class="fade" style="animation-delay:.25s" x="60" y="106" font-size="20" font-weight="600" fill="#6C63FF">Halo, saya</text>
<text class="fade" style="animation-delay:.4s" x="60" y="152" font-size="38" font-weight="800" fill="#1E1B4B">Rizka Farida Damayanti</text>
<text class="role" x="60" y="198" font-size="24" font-weight="700" fill="#6C63FF">Frontend Developer</text>
<text class="role r2" x="60" y="198" font-size="24" font-weight="700" fill="#F08C00">Full Stack Enthusiast</text>
<text class="role r3" x="60" y="198" font-size="24" font-weight="700" fill="#0096C7">AI &#183; Data &#183; IoT Enthusiast</text>
<g class="fade" style="animation-delay:0.60s"><rect x="60" y="226" width="62" height="28" rx="14" fill="#fff" stroke="#4FC08D" stroke-opacity=".35"/><circle cx="75" cy="240" r="4" fill="#4FC08D"/><text x="86" y="245" font-size="13" font-weight="600" fill="#334155">Vue</text></g><g class="fade" style="animation-delay:0.72s"><rect x="132" y="226" width="94" height="28" rx="14" fill="#fff" stroke="#FF2D20" stroke-opacity=".35"/><circle cx="147" cy="240" r="4" fill="#FF2D20"/><text x="158" y="245" font-size="13" font-weight="600" fill="#334155">Laravel</text></g><g class="fade" style="animation-delay:0.84s"><rect x="236" y="226" width="78" height="28" rx="14" fill="#fff" stroke="#A259FF" stroke-opacity=".35"/><circle cx="251" cy="240" r="4" fill="#A259FF"/><text x="262" y="245" font-size="13" font-weight="600" fill="#334155">Figma</text></g><g class="fade" style="animation-delay:0.96s"><rect x="324" y="226" width="78" height="28" rx="14" fill="#fff" stroke="#4479A1" stroke-opacity=".35"/><circle cx="339" cy="240" r="4" fill="#4479A1"/><text x="350" y="245" font-size="13" font-weight="600" fill="#334155">MySQL</text></g><g class="fade" style="animation-delay:1.08s"><rect x="412" y="226" width="86" height="28" rx="14" fill="#fff" stroke="#3776AB" stroke-opacity=".35"/><circle cx="427" cy="240" r="4" fill="#3776AB"/><text x="438" y="245" font-size="13" font-weight="600" fill="#334155">Python</text></g>

<g class="bob" style="animation-duration:6s">
<rect x="590" y="60" width="250" height="185" rx="16" fill="#fff" stroke="#E4E0FF" filter="url(#shadow)"/>
<circle cx="610" cy="80" r="4.5" fill="#FF5F57"/><circle cx="626" cy="80" r="4.5" fill="#FEBC2E"/><circle cx="642" cy="80" r="4.5" fill="#28C840"/>
<line x1="590" y1="95" x2="840" y2="95" stroke="#EEF0FA"/>
<rect x="610" y="112" width="0" height="9" rx="4.5" fill="#6C63FF"><animate attributeName="width" values="0;120;120;0" keyTimes="0;0.3;0.88;1" dur="7s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="626" y="132" width="0" height="9" rx="4.5" fill="#00B4D8"><animate attributeName="width" values="0;150;150;0" keyTimes="0;0.3;0.88;1" dur="7s" begin="0.5s" repeatCount="indefinite"/></rect><rect x="626" y="152" width="0" height="9" rx="4.5" fill="#FF9F1C"><animate attributeName="width" values="0;100;100;0" keyTimes="0;0.3;0.88;1" dur="7s" begin="1.0s" repeatCount="indefinite"/></rect><rect x="626" y="172" width="0" height="9" rx="4.5" fill="#4FC08D"><animate attributeName="width" values="0;140;140;0" keyTimes="0;0.3;0.88;1" dur="7s" begin="1.5s" repeatCount="indefinite"/></rect><rect x="610" y="192" width="0" height="9" rx="4.5" fill="#6C63FF"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.3;0.88;1" dur="7s" begin="2.0s" repeatCount="indefinite"/></rect><rect x="626" y="212" width="0" height="9" rx="4.5" fill="#FF6584"><animate attributeName="width" values="0;110;110;0" keyTimes="0;0.3;0.88;1" dur="7s" begin="2.5s" repeatCount="indefinite"/></rect>
</g>
<g class="bob" style="animation-delay:0s"><rect x="546" y="40" width="44" height="44" rx="12" fill="#fff" stroke="#4FC08D" stroke-opacity=".3" filter="url(#shadow)"/><text x="568" y="69" text-anchor="middle" font-size="22" font-weight="800" fill="#4FC08D">V</text></g><g class="bob" style="animation-delay:-1.3s"><rect x="810" y="36" width="44" height="44" rx="12" fill="#fff" stroke="#FF2D20" stroke-opacity=".3" filter="url(#shadow)"/><text x="832" y="65" text-anchor="middle" font-size="22" font-weight="800" fill="#FF2D20">L</text></g><g class="bob" style="animation-delay:-2.4s"><rect x="800" y="214" width="44" height="44" rx="12" fill="#fff" stroke="#A259FF" stroke-opacity=".3" filter="url(#shadow)"/><text x="822" y="243" text-anchor="middle" font-size="22" font-weight="800" fill="#A259FF">F</text></g><g class="bob" style="animation-delay:-3.1s"><rect x="544" y="198" width="44" height="44" rx="12" fill="#fff" stroke="#3776AB" stroke-opacity=".3" filter="url(#shadow)"/><text x="566" y="227" text-anchor="middle" font-size="18" font-weight="800" fill="#3776AB">Py</text></g>
</svg>