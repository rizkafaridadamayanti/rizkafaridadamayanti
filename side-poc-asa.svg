<svg xmlns="http://www.w3.org/2000/svg" width="445" height="120" viewBox="0 0 445 120" role="img" aria-label="Repository poc-asa"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,'Liberation Mono',monospace;font-weight:700}
