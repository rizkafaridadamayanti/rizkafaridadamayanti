<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="Penghargaan: Pull Shark terbuka">
<title>Penghargaan: Pull Shark terbuka</title>
<defs></defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono','Courier New',monospace}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1s ease-out both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="899" height="155" rx="14" fill="#1F1A17" stroke="#3A302A"/>
<circle cx="82" cy="78" r="38" fill="#171311" stroke="#E2737B" stroke-opacity=".7" stroke-width="1.5"/>
<path d="M82,52 L88.2,67.4 104.8,68.8 92.2,79.6 96,95.8 82,87.2 68,95.8 71.8,79.6 59.2,68.8 75.8,67.4 Z" fill="#E2737B" fill-opacity=".9"/>
<text class="fade" x="146" y="64" font-size="24" font-weight="700" fill="#F4EBDD">Pull Shark</text>
<g class="fade" style="animation-delay:.15s"><rect x="146" y="76" width="76" height="24" rx="12" fill="#9DB17C" fill-opacity=".12" stroke="#9DB17C" stroke-opacity=".7"/><text class="m" x="184" y="92" font-size="11.5" fill="#9DB17C" text-anchor="middle">TERBUKA</text></g>
<text class="fade" style="animation-delay:.3s" x="146" y="128" font-size="14" fill="#A39482">Membuka pull request yang berhasil di-merge.</text>
<circle cx="700" cy="70" r="30" fill="none" stroke="#A39482" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="700" y="80" font-size="26" font-weight="700" fill="#A39482" fill-opacity=".6" text-anchor="middle">?</text><text class="m" x="700" y="126" font-size="10" fill="#A39482" letter-spacing="2" text-anchor="middle">TERKUNCI</text>
<circle cx="790" cy="70" r="30" fill="none" stroke="#A39482" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="790" y="80" font-size="26" font-weight="700" fill="#A39482" fill-opacity=".6" text-anchor="middle">?</text><text class="m" x="790" y="126" font-size="10" fill="#A39482" letter-spacing="2" text-anchor="middle">TERKUNCI</text>
