<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Papan penghargaan: Pull Shark terbuka"><defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131C42"/><stop offset="1" stop-color="#0B1020"/></linearGradient><radialGradient id="rg"><stop offset="0" stop-color="#4C74C9" stop-opacity=".30"/><stop offset="1" stop-color="#4C74C9" stop-opacity="0"/></radialGradient><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></linearGradient></defs><style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.m{font-family:'Courier New',Courier,'Liberation Mono',monospace;font-weight:700}
.w{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.bob{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cl{animation:dr 16s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(36px)}}
.pop{opacity:0;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
